<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Espace Club — Clubs Sportifs</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Syne:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">

  <style>
    /* Styles spécifiques à club.html */
    :root {
      --bg:      #f7f5f0;
      --surface: #ffffff;
      --card:    #f0ede8;
      --border:  rgba(0,0,0,0.09);
      --accent:  #1a3a5c;
      --accent2: #e85d30;
      --text:    #1a1a1a;
      --muted:   #6b6b6b;
    }
    body { background: var(--bg); color: var(--text); }
    header { background: var(--accent); border-bottom: none; }
    .logo  { color: #fff; }
    .logo span { color: var(--accent2); }
    header p { color: rgba(255,255,255,0.6); }

    /* HERO */
    .club-hero {
      background: var(--accent);
      color: #fff;
      padding: 48px 40px 36px;
      position: relative;
      overflow: hidden;
    }
    .club-hero::before {
      content:'';position:absolute;right:-60px;top:-60px;
      width:280px;height:280px;border-radius:50%;
      background:rgba(232,93,48,0.18);
    }
    .club-badge {
      display:inline-block;background:var(--accent2);color:#fff;
      font-size:11px;font-weight:600;letter-spacing:1px;
      text-transform:uppercase;padding:4px 10px;border-radius:6px;
      margin-bottom:12px;
    }
    .club-hero h1 { font-family:'Syne',sans-serif;font-size:clamp(26px,5vw,40px);font-weight:800;margin-bottom:8px; }
    .club-hero .sub { font-size:15px;opacity:0.65; }
    .stats-row { display:flex;gap:28px;margin-top:28px;flex-wrap:wrap; }
    .stat-item .num { font-family:'Syne',sans-serif;font-size:26px;font-weight:800;color:#fff; }
    .stat-item .lbl { font-size:12px;opacity:0.55;margin-top:2px; }

    /* BARRE MODE */
    .mode-bar {
      background:var(--surface);border-bottom:1px solid var(--border);
      padding:12px 36px;display:flex;align-items:center;
      justify-content:space-between;gap:12px;flex-wrap:wrap;
    }
    .mode-bar p { font-size:13px;color:var(--muted); }
    .btn-edit {
      background:var(--accent);color:#fff;border:none;border-radius:8px;
      font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
      padding:8px 18px;cursor:pointer;transition:opacity 0.2s;
    }
    .btn-edit:hover { opacity:0.85; }

    /* CONTENU */
    .content-grid {
      max-width:1080px;margin:36px auto;padding:0 20px;
      display:grid;grid-template-columns:1fr 320px;gap:24px;
    }
    @media(max-width:768px){.content-grid{grid-template-columns:1fr;}}
    .section-title {
      font-family:'Syne',sans-serif;font-size:19px;font-weight:800;
      margin-bottom:18px;
    }
    .section-title span { color:var(--accent2); }

    /* NEWS */
    .news-card {
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:20px 22px;margin-bottom:14px;
    }
    .news-date  { font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:7px; }
    .news-title { font-size:16px;font-weight:600;margin-bottom:7px;line-height:1.3; }
    .news-body  { font-size:14px;color:var(--muted);line-height:1.7; }
    .news-tag   { display:inline-block;background:var(--card);color:var(--accent);font-size:11px;font-weight:600;padding:3px 8px;border-radius:5px;margin-top:10px; }

    /* SIDEBAR */
    .sidebar { display:flex;flex-direction:column;gap:18px; }
    .info-card {
      background:var(--surface);border:1px solid var(--border);
      border-radius:14px;padding:20px 22px;
    }
    .info-card h3 { font-family:'Syne',sans-serif;font-size:14px;font-weight:700;margin-bottom:12px; }
    .info-row { display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px; }
    .info-row:last-child { border-bottom:none; }
    .info-row .key { color:var(--muted); }
    .info-row .val { font-weight:600;text-align:right;max-width:60%; }
    .schedule-row { display:flex;justify-content:space-between;font-size:13px;padding:5px 10px;border-radius:7px;background:var(--card);margin-bottom:4px; }
    .schedule-row .day { font-weight:600; }
    .schedule-row.ferme { opacity:0.38;text-decoration:line-through; }

    /* MODAL */
    .modal-overlay {
      display:none;position:fixed;inset:0;background:rgba(0,0,0,0.5);
      z-index:1000;align-items:center;justify-content:center;
    }
    .modal-overlay.open { display:flex; }
    .modal {
      background:#fff;border-radius:18px;padding:30px;
      width:100%;max-width:540px;max-height:86vh;overflow-y:auto;margin:14px;
    }
    .modal h2 { font-family:'Syne',sans-serif;font-size:19px;font-weight:800;margin-bottom:18px; }
    .modal-tabs { display:flex;gap:5px;background:var(--bg);padding:4px;border-radius:9px;margin-bottom:22px; }
    .tab-btn {
      flex:1;background:none;border:none;font-family:'DM Sans',sans-serif;
      font-size:13px;padding:7px;border-radius:7px;cursor:pointer;color:var(--muted);transition:all 0.2s;
    }
    .tab-btn.active { background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,0.1); }
    .tab-panel { display:none; }
    .tab-panel.active { display:block; }
    .form-group { margin-bottom:14px; }
    .form-label { font-size:12px;font-weight:500;color:var(--muted);display:block;margin-bottom:5px; }
    .form-input,.form-textarea,.form-select {
      width:100%;border:1.5px solid var(--border);border-radius:9px;
      font-family:'DM Sans',sans-serif;font-size:14px;padding:9px 13px;
      outline:none;transition:border-color 0.2s;color:var(--text);background:#fff;
    }
    .form-input:focus,.form-textarea:focus,.form-select:focus { border-color:var(--accent); }
    .form-textarea { resize:vertical;min-height:75px; }
    .modal-actions { display:flex;gap:10px;margin-top:20px;justify-content:flex-end; }
    .btn-save {
      background:var(--accent);color:#fff;border:none;border-radius:8px;
      font-family:'DM Sans',sans-serif;font-size:14px;font-weight:600;
      padding:10px 22px;cursor:pointer;transition:opacity 0.2s;
    }
    .btn-save:hover { opacity:0.85; }
    .btn-cancel {
      background:var(--card);color:var(--muted);border:1px solid var(--border);
      border-radius:8px;font-family:'DM Sans',sans-serif;font-size:14px;padding:10px 18px;cursor:pointer;
    }
    .pub-btn {
      width:100%;background:var(--accent2);color:#fff;border:none;border-radius:8px;
      font-family:'DM Sans',sans-serif;font-size:13px;font-weight:600;
      padding:10px;cursor:pointer;margin-top:4px;transition:opacity 0.2s;
    }
    .pub-btn:hover { opacity:0.85; }

    /* TOAST */
    .toast {
      position:fixed;bottom:24px;right:24px;
      background:var(--accent);color:#fff;
      padding:11px 18px;border-radius:9px;font-size:14px;font-weight:500;
      transform:translateY(70px);opacity:0;transition:all 0.3s;z-index:2000;
    }
    .toast.show { transform:translateY(0);opacity:1; }
  </style>
</head>
<body>

<header>
  <div>
    <div class="logo">Clubs<span>Sport</span></div>
    <p>Espace club — informations publiques</p>
  </div>
</header>

<!-- HERO CLUB -->
<div class="club-hero">
  <div class="club-badge" id="hero-fed">Chargement…</div>
  <h1 id="hero-nom">—</h1>
  <p class="sub" id="hero-region"></p>
  <div class="stats-row">
    <div class="stat-item"><div class="num" id="stat-total">—</div><div class="lbl">Licenciés 2019</div></div>
    <div class="stat-item"><div class="num" id="stat-femmes">—</div><div class="lbl">Femmes</div></div>
    <div class="stat-item"><div class="num" id="stat-hommes">—</div><div class="lbl">Hommes</div></div>
  </div>
</div>

<!-- BARRE MODE -->
<div class="mode-bar">
  <p>Page publique du club. <span style="color:var(--accent)">Connectez-vous</span> pour modifier.</p>
  <button class="btn-edit" onclick="ouvrirModal()">✏️ Modifier les informations</button>
</div>

<!-- CONTENU -->
<div class="content-grid">
  <div>
    <div class="section-title">Actualités <span>&</span> Infos</div>
    <div id="news-list"><p style="color:var(--muted);font-size:14px">Chargement…</p></div>
  </div>
  <div class="sidebar">
    <div class="info-card"><h3>🕐 Horaires</h3><div id="horaires-display"></div></div>
    <div class="info-card"><h3>💳 Cotisations</h3><div id="cotisations-display"></div></div>
    <div class="info-card"><h3>📍 Contact</h3><div id="contact-display"></div></div>
  </div>
</div>

<!-- MODAL EDITION -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h2>Modifier les informations du club</h2>
    <div class="modal-tabs">
      <button class="tab-btn active" onclick="switchTab('actualites')">Actualités</button>
      <button class="tab-btn" onclick="switchTab('horaires')">Horaires</button>
      <button class="tab-btn" onclick="switchTab('cotisations')">Cotisations</button>
      <button class="tab-btn" onclick="switchTab('contact')">Contact</button>
    </div>

    <!-- ACTUALITÉS -->
    <div class="tab-panel active" id="tab-actualites">
      <div class="form-group">
        <label class="form-label">Titre</label>
        <input type="text" class="form-input" id="news-titre" placeholder="Ex : Tournoi de printemps 2025">
      </div>
      <div class="form-group">
        <label class="form-label">Contenu</label>
        <textarea class="form-textarea" id="news-corps" rows="4" placeholder="Décrivez l'actualité…"></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Catégorie</label>
        <select class="form-select" id="news-tag">
          <option>Tournoi</option><option>Entraînement</option>
          <option>Recrutement</option><option>Résultat</option><option>Information</option>
        </select>
      </div>
      <button class="pub-btn" onclick="ajouterActualite()">📢 Publier cette actualité</button>
    </div>

    <!-- HORAIRES -->
    <div class="tab-panel" id="tab-horaires">
      <div id="horaires-form"></div>
    </div>

    <!-- COTISATIONS -->
    <div class="tab-panel" id="tab-cotisations">
      <div class="form-group"><label class="form-label">Adulte (€/an)</label><input type="number" class="form-input" id="cotis-adulte"></div>
      <div class="form-group"><label class="form-label">Jeune – 18 ans (€/an)</label><input type="number" class="form-input" id="cotis-jeune"></div>
      <div class="form-group"><label class="form-label">Famille (€/an)</label><input type="number" class="form-input" id="cotis-famille"></div>
      <div class="form-group"><label class="form-label">Note (réductions…)</label><textarea class="form-textarea" id="cotis-note"></textarea></div>
    </div>

    <!-- CONTACT -->
    <div class="tab-panel" id="tab-contact">
      <div class="form-group"><label class="form-label">Adresse</label><input type="text" class="form-input" id="contact-adresse"></div>
      <div class="form-group"><label class="form-label">Téléphone</label><input type="tel" class="form-input" id="contact-tel"></div>
      <div class="form-group"><label class="form-label">Email</label><input type="email" class="form-input" id="contact-email"></div>
      <div class="form-group"><label class="form-label">Site web</label><input type="url" class="form-input" id="contact-web"></div>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="fermerModal()">Annuler</button>
      <button class="btn-save" onclick="sauvegarder()">💾 Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="club-app.js"></script>
</body>
</html>
