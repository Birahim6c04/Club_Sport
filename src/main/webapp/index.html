<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Club Sportif</title>

    <!-- Style rapide -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #ff9a9e, #fad0c4);
            margin: 0;
            padding: 0;
        }

        header {
            background: #ff6f91;
            color: white;
            padding: 15px;
            text-align: center;
        }

        nav {
            background: #ffb6c1;
            padding: 10px;
            text-align: center;
        }

        nav a {
            margin: 10px;
            text-decoration: none;
            color: black;
            font-weight: bold;
        }

        .container {
            max-width: 800px;
            margin: 30px auto;
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0,0,0,0.1);
        }

        button {
            background: #ff6f91;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #ff3f6c;
        }

        footer {
            text-align: center;
            padding: 10px;
            background: #ffb6c1;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<header>
    <h1>Club Sportif</h1>
</header>

<nav>
    <a href="#">Accueil</a>
    <a href="#">Activités</a>
    <a href="#">Contact</a>
</nav>

<div class="container">
    <h2>Bienvenue</h2>
    <p>Inscris-toi à notre club sportif pour rester en forme 💪</p>

    <form>
        <label>Nom :</label><br>
        <input type="text"><br><br>

        <label>Email :</label><br>
        <input type="email"><br><br>

        <button type="submit">S'inscrire</button>
    </form>
</div>

<footer>
    © 2026 Club Sportif
</footer>

</body>
</html>
