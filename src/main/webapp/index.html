<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Club de Sport</title>

    <!-- Feuille de style externe -->
    <link rel="stylesheet" href="style.css">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================= -->
    <div class="navbar">

        <!-- Partie gauche : logo + liens -->
        <div class="nav-left">
            <h1>⚽ Club Sportif</h1>
            <a href="#">Accueil</a>
            <a href="#">Activités</a>
        </div>

        <!-- Partie droite : boutons -->
        <div class="nav-right">
            <a href="#" class="btn inscription">S'inscrire</a>
            <a href="#" class="btn connexion">Se connecter</a>
        </div>

    </div>

    <!-- =========================
         HERO
    ========================= -->
    <div class="hero">

        <!-- Titre principal -->
        <h2>Bienvenue dans notre club</h2>

        <!-- Sous-titre -->
        <p>Recherchez une activité sportive</p>

        <!-- Barre de recherche -->
        <div class="search-box">
            <input type="text" placeholder="Rechercher un sport...">
            <button>Rechercher</button>
        </div>

    </div>

    <!-- =========================
         SECTION CARTE
    ========================= -->
    <div class="map-section">
        <h3>📍 Nous trouver</h3>
        <div id="map"></div>
    </div>

    <!-- =========================
         FOOTER
    ========================= -->
    <footer>
        <p>© 2026 Club Sportif</p>
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Script carte France avec départements -->
    <script>
        // Carte sans zoom initial fixe : fitBounds se chargera du cadrage
        const map = L.map('map', { zoomSnap: 0.25 });

        // Fond OSM standard (comme l'exemple)
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
            maxZoom: 19
        }).addTo(map);

        // GeoJSON simplifié des départements (~100 Ko)
        fetch('https://raw.githubusercontent.com/gregoiredavid/france-geojson/master/departements-version-simplifiee.geojson')
            .then(res => res.json())
            .then(data => {
                const geojsonLayer = L.geoJSON(data, {
                    style: {
                        color: '#0ea5b7',
                        weight: 1.5,
                        fillColor: '#c8f3f8',
                        fillOpacity: 0.35
                    },
                    onEachFeature: function(feature, layer) {
                        const nom  = feature.properties.nom;
                        const code = feature.properties.code;

                        layer.bindTooltip('<b>' + code + '</b> — ' + nom, {
                            sticky: true,
                            className: 'dept-tooltip'
                        });

                        layer.on('mouseover', function() {
                            this.setStyle({ fillColor: '#0ea5b7', fillOpacity: 0.5, weight: 2.5 });
                        });
                        layer.on('mouseout', function() {
                            this.setStyle({ fillColor: '#c8f3f8', fillOpacity: 0.35, weight: 1.5 });
                        });
                    }
                }).addTo(map);

                // Cadrage automatique sur la France métropolitaine
                map.fitBounds(geojsonLayer.getBounds(), { padding: [20, 20] });
            })
            .catch(function() {
                document.getElementById('map').innerHTML =
                    '<p style="text-align:center;padding:40px;color:#0ea5b7">Impossible de charger la carte.</p>';
            });
    </script>

    <style>
        .dept-tooltip {
            background: #0ea5b7;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 12px;
            padding: 4px 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .leaflet-tooltip-bottom.dept-tooltip::before {
            border-bottom-color: #0ea5b7;
        }
    </style>

</body>
</html>
