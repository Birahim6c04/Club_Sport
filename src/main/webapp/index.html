
	<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Ma Position en Direct</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #status { font-weight: bold; color: #555; }
        .result { font-size: 1.2em; color: #007bff; margin-top: 20px; }
    </style>
</head>
<body onload="obtenirPosition()">

    <h1>Géolocalisation Immédiate</h1>
    <p id="status">Demande d'autorisation en cours...</p>
    
    <div id="affichage" class="result"></div>

    <script>
        function obtenirPosition() {
            const status = document.querySelector('#status');
            const affichage = document.querySelector('#affichage');

            // 1. Vérifier si le navigateur supporte la géolocalisation
            if (!navigator.geolocation) {
                status.textContent = "La géolocalisation n'est pas supportée par votre navigateur.";
            } else {
                // 2. Tenter de récupérer la position
                navigator.geolocation.getCurrentPosition(succes, erreur);
            }

            // En cas de succès
            function succes(position) {
                const lat = position.coords.latitude;
                const lng = position.coords.longitude;
                
                status.textContent = "📍 Coordonnées trouvées :";
                affichage.innerHTML = `Latitude : <b>${lat}</b> <br> Longitude : <b>${lng}</b>`;
            }

            // En cas d'erreur (refus de l'utilisateur, etc.)
            function erreur() {
                status.textContent = "Impossible de récupérer votre position (accès refusé ou signal faible).";
                status.style.color = "red";
            }
        }
    </script>
</body>
</html>
