services:

  mysql:
    image: mysql:8.0
    container_name: clubs_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: clubs_sportifs
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "3306:3306"
    networks:
      - clubs_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 5

  tomcat:
    build: .
    container_name: clubs_tomcat
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - ./uploads:/app/uploads
      - ./tomcat/keystore.jks:/usr/local/tomcat/conf/keystore.jks
      - ./tomcat/server.xml:/usr/local/tomcat/conf/server.xml
    networks:
      - clubs_network

volumes:
  mysql_data:

networks:
  clubs_network:
    driver: bridge